[package]
name = "cu-scanner"
version = "1.0.0"
edition = "2021"
description = "CSAF to OVAL converter with HTTP API"

[dependencies]
# Web framework
actix-web = "4"
actix-cors = "0.7"
actix-rt = "2"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "migrate", "chrono", "any", "macros"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = { version = "0.38", features = ["serialize"] }

# HTTP client
reqwest = { version = "0.12", features = ["rustls-tls", "stream"], default-features = false }

# Gzip decompression for repodata primary.xml.gz
flate2 = "1"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Config
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-actix-web = "0.7"

# Auth
jsonwebtoken = "9"
bcrypt = "0.16"
uuid = { version = "1", features = ["v4"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Cron scheduler
tokio-cron-scheduler = "0.13"

# Rate limiting
governor = "0.7"

# Error handling
thiserror = "2"

# Password input (for CLI user commands)
rpassword = "7"

# Bytes (for download service)
bytes = "1"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
rstest = "0.23"

[features]
default = ["sqlite", "postgres", "mysql"]
sqlite = ["sqlx/sqlite"]
postgres = ["sqlx/postgres"]
mysql = ["sqlx/mysql"]
